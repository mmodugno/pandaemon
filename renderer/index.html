<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <link rel="stylesheet" href="panda.css" />
</head>
<body>
  <div class="drag-handle"></div>

  <div id="bubble" class="bubble hidden"></div>
  <div id="counters" class="counters"></div>

  <div id="panda" class="panda calm">
    <svg viewBox="0 0 200 200" width="180" height="180">
      <!-- Orejas -->
      <circle cx="50"  cy="48" r="22" fill="#222" />
      <circle cx="150" cy="48" r="22" fill="#222" />

      <!-- Cara -->
      <ellipse cx="100" cy="105" rx="72" ry="66" fill="#fff" stroke="#222" stroke-width="3" />

      <!-- Manchas de los ojos -->
      <ellipse cx="72"  cy="98" rx="17" ry="22" fill="#222" transform="rotate(20 72 98)" />
      <ellipse cx="128" cy="98" rx="17" ry="22" fill="#222" transform="rotate(-20 128 98)" />

      <!-- Ojos (cada estado muestra el suyo) -->
      <g id="eyes"></g>

      <!-- Nariz -->
      <ellipse cx="100" cy="121" rx="9" ry="6" fill="#222" />

      <!-- Boca (cada estado muestra la suya) -->
      <g id="mouth"></g>

      <!-- Mejillas -->
      <circle id="blushL" cx="58"  cy="126" r="8" fill="#ff9aa8" opacity="0" />
      <circle id="blushR" cx="142" cy="126" r="8" fill="#ff9aa8" opacity="0" />

      <!-- Extras: zzz, gota de sudor, signo de pregunta -->
      <g id="extra"></g>
    </svg>
  </div>

  <script src="panda.js"></script>
</body>
</html>
